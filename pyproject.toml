[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthwave"
version = "0.1.0"
description = "A tiny, vibey terminal radio for Lofi Girl's live streams."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JosTheDude" }]
requires-python = ">=3.9"
dependencies = ["windows-curses; sys_platform == 'win32'"]  # Windows Python has no curses
keywords = ["lofi", "synthwave", "radio", "tui", "mpv", "curses"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.scripts]
synthwave = "synthwave.__main__:main"

[tool.setuptools]
packages = ["synthwave"]
